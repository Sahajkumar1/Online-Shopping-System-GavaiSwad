<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/adminheader :: adminheader('Add Category')"></head>

<body>

    <!-- Sidebar -->
    <div th:replace="fragments/adminsidebar :: adminsidebar"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Navbar -->
        <div th:replace="fragments/adminnavbar :: adminnavbar"></div>

        <div class="container-fluid mt-4">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="card shadow">

                        <div class="card-header bg-warning text-center">

                            <h3 class="mb-0">

                                <i class="bi bi-folder-fill"></i>

                                Category Management

                            </h3>

                        </div>

                        <div class="card-body p-4">

                            <form th:object="${category}"
                                  method="POST"
                                  th:action="@{/admin/category/save}">

                                <div class="mb-4">

                                    <label class="form-label fw-bold">
                                        Category Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           placeholder="Enter Category Name"
                                           th:field="*{cat_name}">

                                </div>

                                <div class="d-grid">

                                    <button type="submit"
                                            class="btn btn-warning btn-lg">

                                        <i class="bi bi-plus-circle"></i>

                                        Insert Category

                                    </button>

                                </div>

                            </form>

                            <hr>

                            <div class="text-center">

                                <a th:href="@{/admin/category/show}"
                                   class="btn btn-secondary">

                                    <i class="bi bi-list-ul"></i>

                                    View Category List

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <div th:replace="fragments/adminfooter :: adminfooter"></div>

    </div>

</body>

</html>

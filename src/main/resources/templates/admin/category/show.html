<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/adminheader :: adminheader('Category List')"></head>

<body>

    <!-- Sidebar -->
    <div th:replace="fragments/adminsidebar :: adminsidebar"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- Navbar -->
        <div th:replace="fragments/adminnavbar :: adminnavbar"></div>

        <div class="container-fluid mt-4">

            <div class="card shadow">

                <div class="card-header bg-warning d-flex justify-content-between align-items-center">

                    <h3 class="mb-0">
                        <i class="bi bi-folder-fill"></i>
                        Category List
                    </h3>

                    <a th:href="@{/admin/category/add}" class="btn btn-dark">

                        <i class="bi bi-plus-circle"></i>

                        Add Category

                    </a>

                </div>

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover align-middle text-center">

                            <thead class="table-dark">

                                <tr>

                                    <th>Category ID</th>
                                    <th>Category Name</th>
                                    <th>Edit</th>
                                    <th>Delete</th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="category : ${categorys}">

                                    <td th:text="${category.cat_id}"></td>

                                    <td th:text="${category.cat_name}"></td>

                                    <td>

                                        <a th:href="@{/admin/category/edit/{cat_id}(cat_id=${category.cat_id})}"
                                           class="btn btn-warning btn-sm">

                                            <i class="bi bi-pencil-square"></i>

                                            Edit

                                        </a>

                                    </td>

                                    <td>

                                        <a th:href="@{/admin/category/delete/{cat_id}(cat_id=${category.cat_id})}"
                                           class="btn btn-danger btn-sm"
                                           onclick="return confirm('Are you sure you want to delete this category?');">

                                            <i class="bi bi-trash"></i>

                                            Delete

                                        </a>

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

        <!-- Footer -->
        <div th:replace="fragments/adminfooter :: adminfooter"></div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/adminheader :: adminheader('Add Product')"></head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/adminsidebar :: adminsidebar"></div>

<!-- Main Content -->
<div class="content">

    <!-- Navbar -->
    <div th:replace="fragments/adminnavbar :: adminnavbar"></div>

    <div class="container-fluid mt-4">

        <!-- Statistics Cards -->

        <div class="row g-4 mb-4">

            <div class="col-md-3">

                <div class="card dashboard-card card-product">

                    <div class="card-body d-flex justify-content-between">

                        <div>

                            <h6>Total Products</h6>
							<h2 th:text="${totalProducts}"></h2>

                        </div>

                        <i class="bi bi-box-seam display-5"></i>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card dashboard-card card-category">

                    <div class="card-body d-flex justify-content-between">

                        <div>

                            <h6>Brands</h6>
							<h2 th:text="${totalBrands}"></h2>

                        </div>

                        <i class="bi bi-check-circle display-5"></i>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card dashboard-card card-brand">

                    <div class="card-body d-flex justify-content-between">

                        <div>

                            <h6>Categories</h6>
                            
							<h2 th:text="${totalCategories}"></h2>
                        </div>

                        <i class="bi bi-folder display-5"></i>

                    </div>

                </div>

            </div>

           

        </div>

        <!-- Product Form -->

        <div class="card shadow">

            <div class="card-header bg-warning">

                <h3 class="mb-0">
                    Add Product
                </h3>

            </div>

            <div class="card-body">

                <form th:action="@{/admin/product/add}"
                      method="POST"
                      th:object="${product}"
                      enctype="multipart/form-data">

                    <div class="row">

                        <!-- Product Name -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Product Name</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{product_name}">

                        </div>

                        <!-- Cost Price -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Cost Price</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_cost_price}">

                        </div>

                        <!-- Selling Price -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Selling Price</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_selling_price}">

                        </div>

                        <!-- Rating -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Rating</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_rating}">

                        </div>

                        <!-- Weight -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Weight</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_weight}">

                        </div>

                        <!-- Weight Type -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Weight Type</label>

                            <select class="form-select"
                                    th:field="*{product_weight_type}">

                                <option value="g">Gram</option>
                                <option value="kg">Kilogram</option>
                                <option value="l">Litre</option>
                                <option value="ml">Milli Litre</option>

                            </select>

                        </div>

                        <!-- Quantity -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Quantity</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{product_qty}">

                        </div>

                        <!-- Category -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">Category</label>

                            <select class="form-select"
                                    th:field="*{fk_cat_id}">

                                <option th:each="category : ${categories}"
                                        th:value="${category.cat_id}"
                                        th:text="${category.cat_name}">
                                </option>

                            </select>

                        </div>
						                        <!-- Brand -->

						                        <div class="col-md-6 mb-3">

						                            <label class="form-label">Brand</label>

						                            <select class="form-select"
						                                    th:field="*{fk_brand_id}">

						                                <option th:each="brand : ${brands}"
						                                        th:value="${brand.brand_id}"
						                                        th:text="${brand.brand_name}">
						                                </option>

						                            </select>

						                        </div>

						                        <!-- Small Image -->

						                        <div class="col-md-6 mb-3">

						                            <label class="form-label">Small Image</label>

						                            <input type="file"
						                                   class="form-control"
						                                   th:field="*{product_image_sm}">

						                        </div>

						                        <!-- Large Image -->

						                        <div class="col-md-6 mb-3">

						                            <label class="form-label">Large Image</label>

						                            <input type="file"
						                                   class="form-control"
						                                   th:field="*{product_image_lg}">

						                        </div>

						                        <!-- Description -->

						                        <div class="col-12 mb-3">

						                            <label class="form-label">Description</label>

						                            <textarea class="form-control"
						                                      rows="4"
						                                      th:field="*{product_desc}"></textarea>

						                        </div>

						                        <!-- Status -->

						                        <div class="col-md-6 mb-3">

						                            <label class="form-label">Product Status</label>

						                            <select class="form-select"
						                                    th:field="*{product_status}">

						                                <option value="active">Active</option>

						                                <option value="inactive">Inactive</option>

						                            </select>

						                        </div>

						                    </div>

						                    <hr>

						                    <div class="d-flex gap-2">

						                        <button type="submit"
						                                class="btn btn-warning">

						                            <i class="bi bi-floppy"></i>

						                            Save Product

						                        </button>

						                        <a th:href="@{/admin/product/show}"
						                           class="btn btn-secondary">

						                            <i class="bi bi-arrow-left"></i>

						                            Back

						                        </a>

						                    </div>

						                </form>

						            </div>

						        </div>

						    </div>

						    <!-- Footer -->

						    <div th:replace="fragments/adminfooter :: adminfooter"></div>

						</div>

						</body>

						</html>

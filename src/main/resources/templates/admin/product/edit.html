<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/adminheader :: adminheader('Edit Product')"></head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/adminsidebar :: adminsidebar"></div>

<!-- Main Content -->
<div class="content">

    <!-- Navbar -->
    <div th:replace="fragments/adminnavbar :: adminnavbar"></div>

    <div class="container-fluid mt-4">

        <div class="card shadow">

            <div class="card-header bg-warning">
                <h3 class="mb-0">Edit Product</h3>
            </div>

            <div class="card-body">

                <form th:action="@{/admin/product/update}"
                      th:object="${product}"
                      method="post">

                    <!-- Hidden ID -->
                    <input type="hidden" th:field="*{product_id}"/>

                    <div class="row">

                        <!-- Brand -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Select Brand</label>
                            <select class="form-select" th:field="*{fk_brand_id}">
                                <option th:each="brand : ${brands}"
                                        th:value="${brand.brand_id}"
                                        th:text="${brand.brand_name}">
                                </option>
                            </select>
                        </div>

                        <!-- Category -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Select Category</label>
                            <select class="form-select" th:field="*{fk_cat_id}">
                                <option th:each="category : ${categories}"
                                        th:value="${category.cat_id}"
                                        th:text="${category.cat_name}">
                                </option>
                            </select>
                        </div>

                        <!-- Product Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Name</label>
                            <input class="form-control" type="text" th:field="*{product_name}">
                        </div>

                        <!-- Quantity -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantity</label>
                            <input class="form-control" type="number" th:field="*{product_qty}">
                        </div>

                        <!-- Description -->
                        <div class="col-12 mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="4" th:field="*{product_desc}"></textarea>
                        </div>

                        <!-- Cost Price -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cost Price</label>
                            <input class="form-control" type="number" step="0.01"
                                   th:field="*{product_cost_price}">
                        </div>

                        <!-- Selling Price -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Selling Price</label>
                            <input class="form-control" type="number" step="0.01"
                                   th:field="*{product_selling_price}">
                        </div>

                        <!-- Rating -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rating</label>
                            <input class="form-control" type="number"
                                   th:field="*{product_rating}">
                        </div>

                        <!-- Weight -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Weight</label>
                            <input class="form-control" type="number" step="0.01"
                                   th:field="*{product_weight}">
                        </div>

                        <!-- Weight Type -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Weight Type</label>
                            <select class="form-select"
                                    th:field="*{product_weight_type}">
                                <option value="g">Gram</option>
                                <option value="kg">Kilogram</option>
                                <option value="ml">Milli Litre</option>
                                <option value="l">Litre</option>
                            </select>
                        </div>

                        <!-- Status -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select"
                                    th:field="*{product_status}">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>

                        <!-- Small Image -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Small Image</label>
                            <input class="form-control" type="text"
                                   th:field="*{product_image_sm}">
                        </div>

                        <!-- Large Image -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Large Image</label>
                            <input class="form-control" type="text"
                                   th:field="*{product_image_lg}">
                        </div>

                    </div>

                    <div class="mt-4">

                        <button class="btn btn-warning" type="submit">
                            <i class="bi bi-arrow-repeat"></i>
                            Update Product
                        </button>

                        <a th:href="@{/admin/product/show}"
                           class="btn btn-secondary">
                            Back
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <div th:replace="fragments/adminfooter :: adminfooter"></div>

</div>

</body>
</html>

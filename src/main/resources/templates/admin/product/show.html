<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/adminheader :: adminheader('Product List')"></head>

<body>

<!-- Sidebar -->
<div th:replace="fragments/adminsidebar :: adminsidebar"></div>

<!-- Main Content -->
<div class="content">

    <!-- Navbar -->
    <div th:replace="fragments/adminnavbar :: adminnavbar"></div>

    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Product List</h2>

            <a class="btn btn-success"
               th:href="@{/admin/product/add}">
                <i class="bi bi-plus-circle"></i>
                Add Product
            </a>

        </div>

        <div class="card">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover text-center align-middle">

                        <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Brand Id</th>
                            <th>Category Id</th>
                            <th>Qty</th>
                            <th>Cost Price</th>
                            <th>Selling Price</th>
                            <th>Weight</th>
                            <th>Weight Type</th>
                            <th>Rating</th>
                            <th>Status</th>
                            <th>Small Image</th>
                            <th>Large Image</th>
                            <th>Action</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="product : ${products}">

                            <td th:text="${product.product_id}"></td>

                            <td th:text="${product.product_name}"></td>

                            <td th:text="${product.product_desc}"></td>

                            <td th:text="${product.fk_brand_id}"></td>

                            <td th:text="${product.fk_cat_id}"></td>

                            <td th:text="${product.product_qty}"></td>

                            <td th:text="${product.product_cost_price}"></td>

                            <td th:text="${product.product_selling_price}"></td>

                            <td th:text="${product.product_weight}"></td>

                            <td th:text="${product.product_weight_type}"></td>

                            <td th:text="${product.product_rating}"></td>

                            <td th:text="${product.product_status}"></td>

                            <td th:text="${product.product_image_sm}"></td>

                            <td th:text="${product.product_image_lg}"></td>

                            <td>

                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/admin/product/edit/{id}(id=${product.product_id})}">

                                    <i class="bi bi-pencil-square"></i>
                                    Edit

                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/admin/product/delete/{id}(id=${product.product_id})}"
                                   onclick="return confirm('Are you sure you want to delete this product?')">

                                    <i class="bi bi-trash"></i>
                                    Delete

                                </a>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <div th:replace="fragments/adminfooter :: adminfooter"></div>

</div>

</body>

</html>
